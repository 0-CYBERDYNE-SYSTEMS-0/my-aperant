version: 2
updates:
  # npm dependencies (workspaces monorepo: root package-lock.json owns
  # apps/* dependency resolution, so dependabot must run at the repo root
  # or its bumps desync the lockfile and `npm ci` fails in CI)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # @ai-sdk/* packages share @ai-sdk/provider(-utils) type versions;
      # bumping one alone splits provider versions between top-level and
      # nested installs and breaks the TypeScript build (EmbeddingModel
      # v2/v4 union mismatch in embedding-service.ts). Bump them together.
      ai-sdk:
        patterns:
          - "@ai-sdk/*"
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
