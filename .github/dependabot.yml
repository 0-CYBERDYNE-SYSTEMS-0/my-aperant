version: 2
updates:
  # npm dependencies (workspaces monorepo: root package-lock.json owns
  # apps/* dependency resolution, so dependabot must run at the repo root
  # or its bumps desync the lockfile and `npm ci` fails in CI)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The adapters and core `ai` package share provider-model types, but
      # major lines are not API-compatible: the current app uses ai@6/provider
      # v3, while the provider-major updates require ai@7/provider v4. Keep
      # patch/minor updates grouped; defer majors to an explicit migration.
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
        update-types:
          - minor
          - patch
      # react and react-dom must have the exact same version; dependabot
      # bumping one alone triggers React's hard version-mismatch error in
      # every component test. Keep the pair (plus their @types) in lockstep.
      react-lockstep:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    # The SDK major line requires a coordinated source migration; do not
    # emit unsupported adapter/core major bumps as individual PRs.
    ignore:
      - dependency-name: "ai"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@ai-sdk/*"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
