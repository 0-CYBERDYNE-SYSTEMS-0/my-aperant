version: 2
updates:
  # npm dependencies (workspaces monorepo: root package-lock.json owns
  # apps/* dependency resolution, so dependabot must run at the repo root
  # or its bumps desync the lockfile and `npm ci` fails in CI)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
